<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трекер материалов · HSR & Genshin</title>
<style>
:root{
  --bg:#09090f; --panel:#0f0f1a; --panel-2:#13131f;
  --border:rgba(255,255,255,.07);
  --text:#e8e8f2; --muted:#8a8a9e;
  --gold:#f0c060; --gold-dim:rgba(240,192,96,.14);
  --violet:#9b8aff; --violet-dim:rgba(155,138,255,.10);
  --green:#6be3a8; --red:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;font-size:14px}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}

/* Sidebar */
.sidebar{background:linear-gradient(180deg,var(--panel),var(--panel-2));border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:conic-gradient(from 200deg,var(--gold),var(--violet),var(--gold));box-shadow:0 0 22px rgba(155,138,255,.55);flex-shrink:0}
.brand-title{font-weight:800;font-size:15px}
.brand-sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.5px}

.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-item{display:flex;align-items:center;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;border:1px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.03);color:var(--text)}
.nav-item.active{background:var(--gold-dim);color:var(--gold);border-color:rgba(240,192,96,.25)}
.nav-item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sidebar-footer{padding:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.status{font-size:11px;color:var(--muted);padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.03);text-align:center;transition:all .3s}
.status.ok{color:var(--green);background:rgba(107,227,168,.1)}
.status.warn{color:var(--gold);background:var(--gold-dim)}
.status.err{color:var(--red);background:rgba(255,107,107,.1)}

.btn{padding:10px 14px;border-radius:9px;border:1px solid transparent;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-primary{background:linear-gradient(120deg,var(--gold),#e39a3c);color:#1a1405}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(240,192,96,.6)}
.btn-ghost{background:rgba(255,255,255,.03);color:var(--muted);border-color:var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,.06);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
.mobile-bar{display:none}
.main-header{padding:22px 28px 18px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
.main-title{font-size:20px;font-weight:800}
.main-desc{font-size:12.5px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted)}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;border-radius:3px}

.content{flex:1;overflow:auto;padding:20px 28px 40px}
.content::-webkit-scrollbar{width:10px;height:10px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:5px}

/* Table */
.sheet-table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sheet-table th,.sheet-table td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap}
.sheet-table th:last-child,.sheet-table td:last-child{border-right:none}
.sheet-table tr:last-child td{border-bottom:none}
.sheet-table thead th{position:sticky;top:0;z-index:3;background:#161625;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.sheet-table thead th:first-child{left:0;z-index:4;min-width:44px}
.sheet-table tbody th{position:sticky;left:0;z-index:2;background:#12121e;color:var(--muted);font-weight:500;font-size:11px;text-align:center;min-width:44px}
.sheet-table tbody tr:hover td{background:rgba(255,255,255,.02)}
.sheet-table tbody tr:hover th{background:#181826}
.sheet-table td.formula{background:var(--violet-dim);color:#c8bdfc;font-variant-numeric:tabular-nums}
.sheet-table td.editable{padding:0}
.sheet-table td.editable input{width:100%;min-width:60px;background:transparent;border:none;outline:none;color:var(--text);font-size:12.5px;padding:7px 10px;font-family:inherit;border-left:2px solid rgba(240,192,96,.35)}
.sheet-table td.editable input:hover{background:rgba(240,192,96,.05)}
.sheet-table td.editable input:focus{background:rgba(240,192,96,.1);box-shadow:inset 0 0 0 1px rgba(240,192,96,.5)}
.sheet-table td.empty{color:#3a3a4a}
.sheet-table td.num{text-align:right;font-variant-numeric:tabular-nums}

.center-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px;gap:18px}
.center-msg h2{font-size:22px;font-weight:800}
.center-msg p{color:var(--muted);max-width:440px;font-size:13.5px;line-height:1.6}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.08);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-bar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
  .mobile-bar select{flex:1;padding:10px 12px;border-radius:9px;background:var(--panel-2);color:var(--text);border:1px solid var(--border);font-size:14px;font-family:inherit}
  .mobile-bar .btn{padding:10px 14px;font-size:16px;flex-shrink:0}
  .main-header{padding:12px 14px 10px;flex-direction:column;align-items:stretch;gap:2px}
  .main-title{font-size:16px}
  .main-desc{font-size:11.5px}
  .legend{display:none}
  .content{padding:0 0 60px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .sheet-table{border-radius:0;border-left:none;border-right:none;font-size:11.5px}
  .sheet-table th,.sheet-table td{padding:6px 8px}
  .sheet-table thead th,.sheet-table tbody th{font-size:10.5px;min-width:38px}
  .sheet-table td.editable input{font-size:16px;padding:6px 8px;min-width:56px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-title">Трекер материалов</div>
        <div class="brand-sub">HSR · GENSHIN</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="status" id="status">Инициализация…</div>
      <button class="btn btn-primary" id="save-btn" disabled>💾 Сохранить правки</button>
      <button class="btn btn-ghost" id="reset-btn" disabled>↺ Сбросить</button>
    </div>
  </aside>
  <main class="main">
    <header class="mobile-bar">
      <select id="mobile-sheet-select" aria-label="Лист"></select>
      <button class="btn btn-primary" id="mobile-save" title="Сохранить">💾</button>
      <button class="btn btn-ghost" id="mobile-reset" title="Сбросить">↺</button>
    </header>
    <header class="main-header">
      <div>
        <div class="main-title" id="title">Загрузка…</div>
        <div class="main-desc" id="desc"></div>
      </div>
      <div class="legend">
        <div class="lg"><span class="dot" style="background:rgba(240,192,96,.5)"></span>Редактируемое</div>
        <div class="lg"><span class="dot" style="background:rgba(155,138,255,.5)"></span>Формула</div>
      </div>
    </header>
    <div class="content" id="content">
      <div class="center-msg">
        <div class="spinner"></div>
        <p>Загружаем таблицу…</p>
      </div>
    </div>
  </main>
</div>
<script src="formulas.js"></script>
<script src="app.js"></script>
</body>
</html>
